  listen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>'
};

/* colour and glyph for a thing */
const TONES = ['coral','blue','green','rose','sun','teal','violet'];
const CAT_TONE = {words:'coral', word:'coral', language:'coral', english:'coral', vocabulary:'coral', phrases:'coral',
  tech:'blue', technology:'blue', software:'blue', ai:'blue', computing:'blue', internet:'blue',
  money:'green', finance:'green', business:'green', economy:'green', investing:'green', work:'green', career:'green',
  world:'rose', news:'rose', politics:'rose', history:'rose', culture:'rose',
  life:'sun', shopping:'sun', lifestyle:'sun', food:'sun', travel:'sun',
  health:'teal', fitness:'teal', body:'teal', mind:'teal', psychology:'teal',
  science:'violet', space:'violet', nature:'violet', ideas:'violet'};
function toneOf(it) {
  const c = String(it?.category || it?.card?.category || '').toLowerCase().trim();
  if (CAT_TONE[c]) return CAT_TONE[c];
  const first = c.split(/[\s&,]+/)[0];
  if (CAT_TONE[first]) return CAT_TONE[first];
  let h = 0; for (const ch of c) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return TONES[h % TONES.length];
}
const GLYPH = {word:'Aa', phrase:'“ ”', concept:'✦', tech:'</>', news:'◉', product:'₹', place:'⌖', person:'☺', 'how-to':'→', life:'♡', other:'?'};
function glyphOf(it) { const c = it.card || {}; if (/money|finance/i.test(c.category || '')) return '₹'; return GLYPH[c.kind] || '✦'; }
function kindLabel(it) { return String(it.card?.kind || 'thing'); }
function extraOf(it, re) { return (it.card?.extras || []).find((e) => re.test(e.label)); }
function titleSize(t) { const n = String(t || '').length; return n <= 9 ? 'xl' : n <= 14 ? 'l' : n <= 22 ? 'm' : 's'; }
function sticker(it) { return `<button class="st s-${toneOf(it)}" data-a="open" data-id="${it.id}">${esc(it.title || it.card?.title || it.q)}</button>`; }

const EXAMPLE = {id:'__example', q:'ephemeral', ctx:'a meeting with seniors', category:'Words',
  card:{kind:'word', category:'Words', title:'Ephemeral', oneLiner:'Something that lasts only a very short time.',
    extras:[{label:'Pronunciation', value:'ih-FEM-er-ul'}, {label:'Example sentence', value:'“Fame on social media is often ephemeral.”'}]}};

function storyInner(it, example) {
  const c = it.card || {};
  const pron = extraOf(it, /pronunc/i);
  const ex = extraOf(it, /example|analogy|what happened|why it matters|what to look|first step|where you/i);
  const exLabel = ex && !/example/i.test(ex.label) ? `<b>${esc(ex.label)}:</b> ` : '';
  return `<div class="chip"><span class="gl">${esc(glyphOf(it))}</span> · ${example ? 'Example' : esc(kindLabel(it))}</div>
    ${it.ctx ? `<div class="heard">You heard it in: ${esc(it.ctx)}</div>` : ''}
    <div class="grow"></div>
    <h2 class="big ${titleSize(c.title || it.q)}">${esc(c.title || it.q)}</h2>
    ${pron ? `<div class="phon">${esc(pron.value)}</div>` : ''}
    <p class="oneliner">${esc(c.oneLiner)}</p>
    ${ex ? `<div class="ex">${exLabel}${inline(ex.value)}</div>` : ''}
    <div class="swipehint">${example ? '→ Swipe right if you get it, ← left for another day' : '↑ Tap or swipe up for the full story'}</div>`;
}
function topCard(it, example) {
  const t = example ? 'coral' : toneOf(it);
  const name = it.card?.title || it.q;
  return `<article class="story t-${t}" id="top" data-id="${it.id}" tabindex="0" aria-label="${esc(name)}. Swipe right if you got it, left for another day, or tap for the full story.">
    ${storyInner(it, example)}<span class="stamp got">GOT IT</span><span class="stamp later">LATER</span></article>`;
}
function peeks(rest) {
  let h = '';
  if (rest[1]) h += `<div class="peek p2 t-${toneOf(rest[1])}"></div>`;
  if (rest[0]) h += `<div class="peek t-${rest[0] === 'example' ? 'blue' : toneOf(rest[0])}"></div>`;
  return h;
}
function actsHTML(id) {
  const speaking = speakingId === id;
  return `<button class="ac" data-a="later" data-deck="1" data-id="${id}"><span>${ICON.later}</span>Another day</button>
    ${canSpeak ? `<button class="ac" data-a="listen" data-id="${id}"><span>${speaking ? ICON.stop : ICON.listen}</span>${speaking ? 'Stop' : 'Listen'}</button>` : ''}
    <button class="ac go" data-a="got" data-deck="1" data-id="${id}"><span>${ICON.check}</span>Got it</button>`;
}
function deckState() {
  const its = dropIds().map((id) => items.get(id)).filter(Boolean);
  return {its, left:its.filter((i) => !handledToday(i))};
}

function renderToday() {
  const {its, left} = deckState();
  const segs = $('#segs');
  segs.hidden = !its.length;
  segs.style.gridTemplateColumns = `repeat(${Math.max(its.length, 1)},minmax(0,1fr))`;
  segs.innerHTML = its.map((i) => `<span class="${handledToday(i) ? 'on' : ''}"></span>`).join('');
  $('#todayTitle').textContent = its.length > 1 ? `Today's ${its.length}` : its.length ? "Today's thing" : 'Today';
  const date = new Date().toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
  $('#todaySub').textContent = date + (left.length ? ` · ${its.length - left.length + 1} of ${its.length}` : its.length ? ' · all done' : '');

  let deck = '', topId = '';
  if (!loaded) deck = `<div class="endcard"><span class="glow"></span></div>`;
  else if (left.length) { topId = left[0].id; deck = peeks(left.slice(1)) + topCard(left[0], false); }
  else if (its.length) deck = doneCard(its);
  else if (!items.size && !exampleDone) { topId = '__example'; deck = peeks(['example']) + topCard(EXAMPLE, true); }
  else if (!hasKey()) deck = setupCard();
  else if (all().some((i) => i.status === 'brewing')) deck = `<div class="endcard"><span class="glow"></span><h2>Getting your things ready</h2><p>${aiName()} is writing them up. They'll land here in a minute.</p></div>`;
  else deck = `<div class="endcard"><div class="bigtile">✦</div><h2>Nothing new today</h2><p>Enjoy the quiet. When you hear something you want to know, tap + and keep it.</p><button class="btn lamp" data-a="capture">Keep something</button></div>`;
  $('#deck').innerHTML = deck;
  $('#acts').hidden = !topId;
  $('#acts').innerHTML = topId ? actsHTML(topId) : '';
}
function doneCard(its) {
  const learned = its.filter((i) => i.state === 'learned').length;
  return `<div class="endcard"><div class="bigcheck">${ICON.check}</div><h2>That's today.</h2>
    <p>${learned ? `You now know ${learned} more ${learned === 1 ? 'thing' : 'things'}. See you tomorrow.` : 'See you tomorrow.'}</p>
    <div class="stickers">${its.map(sticker).join('')}</div>
    <div class="endbtns">${candidates().length ? '<button class="btn" data-a="onemore">One more?</button>' : ''}<button class="btn line" data-a="capture">Keep something</button></div></div>`;
}
function setupCard() {
  const waiting = all().filter((i) => i.status === 'brewing').length;
  return `<div class="endcard"><div class="bigtile">✦</div><h2>Connect ${aiName()}</h2>
    <p>${waiting ? `${waiting} ${waiting === 1 ? 'thing is' : 'things are'} waiting to be explained. ` : ''}${isGemini() ? 'Add your free Gemini key and Capture starts explaining things for you.' : 'Add your Claude API key and Capture starts explaining things for you.'}</p>
    <button class="btn lamp" data-a="settings">${isGemini() ? 'Add my free key' : 'Add my key'}</button></div>`;
}

/* ---------- shelf ---------- */
function renderShelf() {
  const learned = all().filter((i) => i.state === 'learned' && i.learnedAt);
  const weekAgo = Date.now() - 7 * DAY;
  const weekCount = learned.filter((i) => i.learnedAt >= weekAgo).length;
  $('#shelfCount').textContent = learned.length;
  $('#shelfLbl').innerHTML = `${learned.length === 1 ? 'thing you now know' : 'things you now know'}<small>${weekCount ? `+${weekCount} this week` : learned.length ? 'A quiet week so far' : 'Your collection starts here'}</small>`;

  const counts = {};
  for (const i of learned) { const k = dayKey(i.learnedAt); counts[k] = (counts[k] || 0) + 1; }
  let w = '';
  for (let n = 6; n >= 0; n--) {
    const t = Date.now() - n * DAY, c = counts[dayKey(t)] || 0;
    w += `<div class="wd ${n === 0 ? 'today' : ''}"><i class="${c ? 'on' : ''}">${c || ''}</i>${new Date(t).toLocaleDateString('en-GB', {weekday:'short'}).slice(0, 2)}</div>`;
  }
  $('#week').innerHTML = w;

  for (const b of document.querySelectorAll('#range button')) b.setAttribute('aria-pressed', String(b.dataset.range === range));
  const since = range === 'week' ? weekAgo : range === 'month' ? Date.now() - 30 * DAY : 0;
  const inRange = learned.filter((i) => i.learnedAt >= since);
  const cc = {};
  for (const i of inRange) cc[i.category || 'Other'] = (cc[i.category || 'Other'] || 0) + 1;
  if (cat !== 'All' && !cc[cat]) cat = 'All';
  $('#cats').innerHTML = inRange.length > 0 && Object.keys(cc).length > 1
    ? [['All', inRange.length], ...Object.entries(cc).sort((a, b) => b[1] - a[1])].map(([n, c]) =>
      `<button class="chipf" data-a="cat" data-c="${esc(n)}" aria-pressed="${n === cat}">${n === 'All' ? '' : `<i class="dot-${toneOf({category:n})}"></i>`}${esc(n)}<span class="c">${c}</span></button>`).join('')
    : '';

  const shown = (cat === 'All' ? inRange : inRange.filter((i) => (i.category || 'Other') === cat)).sort((a, b) => b.learnedAt - a.learnedAt);
  let html = '';
  if (!learned.length) html = `<div class="emptyshelf">When you swipe right on a card, it lands here as a little sticker. Tap any sticker later to read it again. <b>Watch it fill up.</b></div>`;
  else if (!shown.length) html = `<div class="emptyshelf">Nothing in this stretch of time. Try <b>All</b>.</div>`;
  else {
    const groups = [];
    for (const i of shown) { const k = dayKey(i.learnedAt); const g = groups[groups.length - 1]; if (g && g.k === k) g.its.push(i); else groups.push({k, its:[i]}); }
    html = groups.map((g) => `<div class="daygroup"><h4>${esc(dayLabel(g.k))}</h4><div class="stickers left">${g.its.map(sticker).join('')}</div></div>`).join('');
  }
  $('#shelfList').innerHTML = html;

  const known = knownSet(), ideas = [];
  for (const i of learned.slice().sort((a, b) => b.learnedAt - a.learnedAt).slice(0, 8))
    for (const r of i.card?.related || []) { const l = r.toLowerCase(); if (!known.has(l) && !ideas.some((x) => x.toLowerCase() === l)) ideas.push(r); }
  $('#nextBox').hidden = !ideas.length;
  $('#nextList').innerHTML = ideas.slice(0, 4).map((x) => `<button class="pillbtn" data-a="keepnext" data-q="${esc(x)}">+ ${esc(x)}</button>`).join('');

  const d = new Set(dropIds());
  const waiting = all().filter((i) => !d.has(i.id) && (i.state === 'waiting' || i.state === 'later')).sort((a, b) => b.createdAt - a.createdAt);
  const gone = all().filter((i) => i.state === 'letgo').sort((a, b) => (b.letgoAt || 0) - (a.letgoAt || 0)).slice(0, 30);
  $('#jar').querySelector('summary').textContent = waiting.length ? `Waiting in the jar (${waiting.length})` : 'Waiting in the jar';
  let j = '';
  if (!waiting.length && !gone.length) j = `<p class="help" style="padding:6px 2px">Empty. Everything is on your shelf or in today's cards.</p>`;
  j += waiting.map((i) => {
    const s = i.status === 'brewing' ? 'Getting ready' : i.status === 'failed' ? "Couldn't prepare" : i.state === 'later' ? 'Another day' : 'Ready';
    const btn = i.status === 'failed' ? `<button class="linkbtn" data-a="retry" data-id="${i.id}">Try again</button>` : `<button class="linkbtn" data-a="open" data-id="${i.id}">Open</button>`;
    return `<div class="jrow"><span class="jt">${esc(i.title || i.q)}</span><span class="js">${s}</span>${btn}</div>`;
  }).join('');
  if (gone.length) j += `<span class="jsub">Let go</span>` + gone.map((i) => `<div class="jrow"><span class="jt muted">${esc(i.title || i.q)}</span><button class="linkbtn" data-a="open" data-id="${i.id}">Open</button></div>`).join('');
  $('#jarList').innerHTML = j;
}

/* ---------- full story sheet ---------- */
function relatedChips(c) {
  const known = knownSet();
  const r = (c.related || []).filter((x) => !known.has(x.toLowerCase()));
  if (!r.length) return '';
  return `<section class="sec"><h3>Learn next</h3><div class="nextchips">${r.map((x) => `<button class="pillbtn" data-a="keepnext" data-q="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div></section>`;
}
function chatHTML(it) {
  const id = it.id;
  const model = it.chatModel || settings.chatModel || 'haiku';
  const busy = chatBusy.has(id);
  const g = isGemini();
  const searching = !g || settings.geminiSearch;
  const msgs = (it.chat || []).map((m) => m.role === 'user'
    ? `<div class="msg me">${esc(m.text)}</div>`
    : `<div class="msg ai">${prose(m.text)}${sourcesHTML(m.sources)}${(m.by || m.model) ? `<span class="by">${esc(m.by || MODELS[m.model]?.name || '')}</span>` : ''}</div>`).join('');
  const foot = g
    ? (settings.geminiSearch ? 'Gemini, free. Searches Google when it needs to.' : 'Gemini, free. For the very latest news, continue in Claude.')
    : (model === 'sonnet' ? 'Sonnet: richer answers, about 5¢ a question.' : 'Haiku: quick and very cheap.');
  return `<section class="sec" id="asksec"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0">Ask about it</h3>
      ${g ? '' : `<div class="seg" role="group" aria-label="Model">
        <button data-a="model" data-m="haiku" data-id="${id}" aria-pressed="${model === 'haiku'}">Haiku</button>
        <button data-a="model" data-m="sonnet" data-id="${id}" aria-pressed="${model === 'sonnet'}">Sonnet</button></div>`}</div>
    <div class="msgs">${msgs || `<p class="help">Ask anything: how it's used, an example from real life, what's new with it.${searching ? ` ${aiName()} searches the web when it needs fresh information.` : ''}</p>`}
      ${busy ? `<div class="msg ai"><span class="thinking"><span class="glow"></span>Thinking…</span></div>` : ''}</div>
    <form class="chatbox" data-chat="${id}"><textarea id="chat-${id}" rows="1" placeholder="Ask a question…" ${busy ? 'disabled' : ''}></textarea><button class="btn lamp" type="submit" ${busy ? 'disabled' : ''}>Ask</button></form>
    <div class="chatfoot" id="chatEnd"><span>${foot}</span><span class="spacer"></span><button class="linkbtn" data-a="continue" data-id="${id}">Continue in Claude</button></div>
  </section>`;
}
function storySheetHTML(it) {
  const id = it.id;
  if (it.status !== 'ready') {
    const failed = it.status === 'failed';
    return `<div class="plain"><h2 class="sh2">${esc(it.q)}</h2>
      <p class="help" style="margin-top:8px;font-size:15px">${failed ? esc(it.err || 'Something went wrong while explaining this.') : !hasKey() ? `Saved. It will be explained once your ${aiName()} key is added.` : `${aiName()} is writing this up. It will be here in a minute.`}</p>
      <div class="endbtns" style="justify-content:flex-start;margin-top:16px">${failed ? `<button class="btn" data-a="retry" data-id="${id}">Try again</button>` : ''}<button class="btn line" data-a="forget" data-id="${id}">Delete</button></div></div>`;
  }
  const c = it.card || {};
  const pron = extraOf(it, /pronunc/i);
  const extras = (c.extras || []).filter((e) => e !== pron);
  const dl = extras.length ? `<dl class="extras">${extras.map((e) => `<dt>${esc(e.label)}</dt><dd>${inline(e.value)}</dd>`).join('')}</dl>` : '';
  const speaking = speakingId === id;
  let acts;
  if (it.state === 'learned') acts = `<span class="note">On your shelf since ${esc(fmtDay(it.learnedAt))}</span><button class="btn line" data-a="back" data-id="${id}" style="flex:none">Not quite yet</button>`;
  else if (it.state === 'letgo') acts = `<button class="btn line" data-a="forget" data-id="${id}">Delete for good</button><button class="btn" data-a="back" data-id="${id}">Bring it back</button>`;
  else acts = `<button class="btn line" data-a="later" data-id="${id}">Another day</button><button class="btn good" data-a="got" data-id="${id}">${ICON.check}Got it</button>`;
  return `<div class="sheethead t-${toneOf(it)}">
      <div class="chip"><span class="gl">${esc(glyphOf(it))}</span> · ${esc(kindLabel(it))}${c.category && !c.category.toLowerCase().startsWith(kindLabel(it).toLowerCase()) ? ` · ${esc(c.category)}` : ''}</div>
      ${it.ctx ? `<div class="heard">You heard it in: ${esc(it.ctx)}</div>` : ''}
      <h2 class="big ${titleSize(c.title || it.q)}">${esc(c.title || it.q)}</h2>
      ${pron ? `<div class="phon">${esc(pron.value)}</div>` : ''}
      <p class="oneliner">${esc(c.oneLiner)}</p>
    </div>
    ${c.gist || dl ? `<section class="sec"><h3>The gist</h3>${dl}${prose(c.gist)}</section>` : ''}
    ${c.deep ? `<section class="sec"><h3>Going deeper</h3>${prose(c.deep)}${(it.sources || []).length ? sourcesHTML(it.sources) : ''}</section>` : ''}
    ${relatedChips(c)}
    ${chatHTML(it)}
    <div class="minor">
      ${canSpeak ? `<button class="linkbtn" data-a="listen" data-id="${id}">${speaking ? 'Stop reading' : 'Read it to me'}</button>` : ''}
      ${it.state !== 'letgo' && it.state !== 'learned' ? `<button class="linkbtn" data-a="letgo" data-id="${id}">Let it go</button>` : ''}
    </div>
    <div class="sheetacts">${acts}</div>`;
}
function captureHTML() {
  return `<form class="capform" id="captureForm" autocomplete="off">
    <h2 class="sh2">Heard something?</h2>
    <textarea id="q" rows="3" placeholder="A word, a topic, something someone mentioned…" aria-label="What did you hear?"></textarea>
    <input class="input" id="ctx" type="text" placeholder="Where did it come up? (optional)" aria-label="Where did it come up?">
    <div class="caprow">${SR ? `<button type="button" class="micbig" id="mic" aria-label="Say it">${ICON.mic}</button>` : ''}<button class="btn lamp" id="keep" type="submit" disabled>Keep it</button></div>
    <p class="help">Just the word is enough. ${aiName()} explains it while you get on with your day.</p>
  </form>`;
}

/* ---------- sheet + render ---------- */
function renderSheet() {
  if (!sheet) return;
  const body = $('#sheetBody');
  if (sheet.type === 'settings') {
    $('#sheetLabel').textContent = 'Settings';
    if (!body.dataset.settings) { body.innerHTML = settingsHTML(); body.dataset.settings = '1'; delete body.dataset.capture; }
    return;
  }
  if (sheet.type === 'capture') {
    $('#sheetLabel').textContent = 'Keep something';
    if (!body.dataset.capture) {
      body.innerHTML = captureHTML(); body.dataset.capture = '1'; delete body.dataset.settings;
      if (sheet.prefill) { $('#q').value = sheet.prefill; $('#ctx').value = sheet.ctx || ''; onQInput(); }
      setTimeout(() => $('#q')?.focus(), 80);
    }
    return;
  }
  delete body.dataset.settings; delete body.dataset.capture;
  const it = items.get(sheet.id);
  if (!it) { closeSheet(); return; }
  $('#sheetLabel').textContent = it.state === 'learned' ? 'From your shelf' : it.state === 'letgo' ? 'Let go' : 'The full story';
  const panel = $('#sheet .panel'), scroll = panel.scrollTop;
  const ta = document.getElementById('chat-' + it.id);
  const draft = ta ? ta.value : '', hadFocus = ta && document.activeElement === ta;
  body.innerHTML = storySheetHTML(it);
  const ta2 = document.getElementById('chat-' + it.id);
  if (ta2) { ta2.value = draft; if (hadFocus) ta2.focus(); }
  panel.scrollTop = scroll;
}
function render() {
  if (drag) { needRender = true; return; }
  $('#view-today').hidden = view !== 'today';
  $('#view-shelf').hidden = view !== 'shelf';
  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.view === view));
  if (view === 'today') renderToday(); else renderShelf();
  renderSheet();
}
function openSheet(s) {
  sheet = s;
  const body = $('#sheetBody'); delete body.dataset.settings; delete body.dataset.capture;
  $('#sheet').hidden = false;
  document.body.style.overflow = 'hidden';
  render();
  $('#sheet .panel').scrollTop = 0;
}
function closeSheet() {
  if (rec) { try { rec.abort(); } catch {} }
  sheet = null; $('#sheet').hidden = true; document.body.style.overflow = '';
  const body = $('#sheetBody'); delete body.dataset.settings; delete body.dataset.capture; body.innerHTML = '';
}
function onQInput() { const q = $('#q'), k = $('#keep'); if (q && k) k.disabled = !q.value.trim(); }

/* ---------- deck gestures ---------- */
function commit(dir) {
  const card = $('#top');
  if (!card) return;
  const id = card.dataset.id;
  card.classList.remove('dragging'); card.style.transform = '';
  card.classList.add(dir === 'right' ? 'fly-right' : 'fly-left');
  try { navigator.vibrate && navigator.vibrate(dir === 'right' ? [12, 40, 14] : 10); } catch {}
  setTimeout(() => {
    if (id === '__example') { exampleDone = true; toast('That was an example. Tap + to keep your own.'); render(); }
    else act(id, dir === 'right' ? 'got' : 'later');
  }, reduceMotion() ? 0 : 230);
}
function stamps(card, dx) {
  const g = card.querySelector('.stamp.got'), l = card.querySelector('.stamp.later');
  if (g) g.style.opacity = Math.max(0, Math.min(1, dx / 90));
  if (l) l.style.opacity = Math.max(0, Math.min(1, -dx / 90));
}
document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('#top');
  if (!card || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = {card, x:e.clientX, y:e.clientY, dx:0, dy:0, moved:false, pid:e.pointerId};
  try { card.setPointerCapture(e.pointerId); } catch {}
  card.classList.add('dragging');
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.dx = e.clientX - drag.x; drag.dy = e.clientY - drag.y;
  if (Math.abs(drag.dx) + Math.abs(drag.dy) > 8) drag.moved = true;
  const up = Math.min(drag.dy, 0);
  drag.card.style.transform = `translate(${drag.dx}px, ${up * 0.5 + Math.max(drag.dy, 0) * 0.15}px) rotate(${drag.dx / 20}deg)`;
  stamps(drag.card, drag.dx);
});
function endDrag(e, cancelled) {
  if (!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  d.card.classList.remove('dragging');
  stamps(d.card, 0);
  const id = d.card.dataset.id;
  if (!cancelled && d.dx > 90) commit('right');
  else if (!cancelled && d.dx < -90) commit('left');
  else {
    d.card.style.transform = '';
    if (!cancelled && ((d.dy < -70 && Math.abs(d.dx) < 70) || !d.moved)) {
      if (id === '__example') toast('Swipe right if you get it, left for another day.');
      else openSheet({type:'card', id});
    }
  }
  if (needRender) { needRender = false; setTimeout(render, reduceMotion() ? 0 : 260); }
}
document.addEventListener('pointerup', (e) => endDrag(e, false));
document.addEventListener('pointercancel', (e) => endDrag(e, true));

function speakExample() {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Ephemeral. Something that lasts only a very short time.'); u.lang = 'en-IN'; u.rate = 0.97; speechSynthesis.speak(u); } catch {}
}

/* ---------- events ---------- */
document.addEventListener('input', (e) => { if (e.target.id === 'q') onQInput(); });
document.addEventListener('submit', (e) => {
  if (e.target.id === 'captureForm') {
    e.preventDefault();
    const v = $('#q').value, c = $('#ctx') ? $('#ctx').value : '';
    if (!v.trim()) return;
    closeSheet();
    capture(v, c);
    toast(hasKey() ? `Kept. ${aiName()} is on it.` : `Kept. It will be explained once ${aiName()} is connected.`);
    return;
  }
  const f = e.target.closest('form[data-chat]');
  if (!f) return;
  e.preventDefault();
  const id = f.dataset.chat, ta = f.querySelector('textarea');
  const it = items.get(id);
  const text = ta.value; ta.value = '';
  sendChat(id, text, it?.chatModel || settings.chatModel || 'haiku');
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#captureForm').requestSubmit(); return; }
  if (e.target.matches?.('form[data-chat] textarea') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); e.target.form.requestSubmit(); return; }
  if (e.key === 'Escape' && sheet) { closeSheet(); render(); return; }
  if (!sheet && view === 'today' && !/INPUT|TEXTAREA/.test(e.target.tagName || '') && $('#top')) {
    if (e.key === 'ArrowRight') { e.preventDefault(); commit('right'); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); commit('left'); }
    else if ((e.key === 'ArrowUp' || e.key === 'Enter') && e.target.id === 'top') { e.preventDefault(); const id = $('#top').dataset.id; if (id !== '__example') openSheet({type:'card', id}); }
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'cap') { settings.cap = Math.max(0, parseFloat(e.target.value) || 0); setKV('settings', settings); if (blocked === 'cap' && !overCap()) { blocked = null; clearBanner(); pump(); } delete $('#sheetBody').dataset.settings; render(); }
  if (e.target.id === 'searchCards') { settings.searchCards = e.target.checked; setKV('settings', settings); }
  if (e.target.id === 'geminiSearch') { settings.geminiSearch = e.target.checked; setKV('settings', settings); }
});
document.addEventListener('click', (e) => {
  if (e.target.closest('#mic')) { toggleMic(); return; }
  const t = e.target.closest('[data-a],[data-view],[data-range]');
  if (!t) return;
  if (t.dataset.view) { if (sheet) closeSheet(); view = t.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.range) { range = t.dataset.range; render(); return; }
  const a = t.dataset.a, id = t.dataset.id;
  switch (a) {
    case 'got': case 'later':
      if (t.dataset.deck && $('#top')?.dataset.id === id) return commit(a === 'got' ? 'right' : 'left');
      return act(id, a);
    case 'listen':
      if (id === '__example') return speakExample();
      speak(id); return;
    case 'open': if (id && id !== '__example') openSheet({type:'card', id}); return;
    case 'capture': return openSheet({type:'capture'});
    case 'cat': cat = t.dataset.c; render(); return;
    case 'onemore': return maybeFillDrop(1);
    case 'keepnext': capture(t.dataset.q, ''); toast(`Kept "${t.dataset.q}". ${aiName()} is on it.`); return;
    case 'model': { const it = items.get(id); if (it) { it.chatModel = t.dataset.m; putItem(it); render(); } return; }
    case 'continue': return continueInClaude(id);
    case 'settings': return openSheet({type:'settings'});
    case 'savekey': return saveKey();
    case 'removekey': if (isGemini()) settings.geminiKey = ''; else settings.apiKey = ''; setKV('settings', settings); blocked = 'no_key'; delete $('#sheetBody').dataset.settings; render(); toast('Key removed from this phone.'); return;
    case 'provider': {
      settings.provider = t.dataset.p === 'claude' ? 'claude' : 'gemini';
      setKV('settings', settings);
      blocked = null; pausedUntil = 0; clearBanner();
      if (!hasKey()) blocked = 'no_key';
      else if (!isGemini() && overCap()) handleBlocking({code:'cap'});
      delete $('#sheetBody').dataset.settings; render(); pump();
      return;
    }
    case 'defmodel': settings.chatModel = t.dataset.m; setKV('settings', settings); delete $('#sheetBody').dataset.settings; render(); return;
    case 'export': return exportData();
    case 'install': if (installPrompt) { const ip = installPrompt; ip.prompt(); ip.userChoice.finally(() => { installPrompt = null; if ($('#bannerBtn').dataset.a === 'install') clearBanner(); render(); }); } return;
    case 'console': window.open('https://platform.claude.com/', '_blank', 'noopener'); return;
    default: if (id) act(id, a);
  }
});
$('#sheetClose').addEventListener('click', () => { closeSheet(); render(); });
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') { closeSheet(); render(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden && loaded) { render(); maybeFillDrop(); pump(); } });
window.addEventListener('online', () => { pausedUntil = 0; pump(); });
// Chrome's own install prompt is held back, so offer it visibly instead of only inside Settings
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); installPrompt = e;
  if (!isStandalone() && $('#banner').hidden) setBanner('Install Capture on your home screen. It opens like an app and works offline.', 'Install', 'install');
});
window.addEventListener('appinstalled', () => { installPrompt = null; if ($('#bannerBtn').dataset.a === 'install') clearBanner(); });

/* ---------- boot ---------- */
render();
(async () => {
  try {
    idb = await openDB();
    const [its, m, s, sp, us] = await Promise.all([tx('items', 'readonly', (st) => st.getAll()), getKV('meta'), getKV('settings'), getKV('spend'), getKV('usage')]);
    for (const it of its || []) items.set(it.id, it);
    if (m) meta = m;
    if (s) settings = {...settings, ...s};
    if (sp) spend = sp;
    if (us) usage = us;
    rollMonth(); rollUsage();
  } catch (e) {
    console.warn(e);
    setBanner("This browser won't let Capture save anything. Open it in Chrome (not a private tab).");
  }
  loaded = true;
  const p = new URLSearchParams(location.search);
  const shared = [p.get('title'), p.get('text')].filter(Boolean).join(' — ').trim();
  const url = p.get('url');
  const wantAdd = p.has('add');
  if ([...p.keys()].length) history.replaceState(null, '', location.pathname);
  if (!hasKey()) blocked = 'no_key';
  else if (!isGemini() && overCap()) handleBlocking({code:'cap'});
  render();
  maybeFillDrop();
  pump();
  if (shared || url) openSheet({type:'capture', prefill:shared || url, ctx:shared && url ? url : ''});
  else if (wantAdd) openSheet({type:'capture'});
})();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && !sheet) { reloaded = true; location.reload(); } });
}
})();
</script>
</body>
</html>
