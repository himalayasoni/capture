<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Capture</title>
<meta name="description" content="Keep anything you want to learn. It gets explained and handed back a few a day.">
<meta name="theme-color" content="#EEF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Capture">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Ledger's sibling. Today is one full-height deck of story cards (one big colour card at a time,
   swipe right = got it, left = another day, tap/up = full story). A bottom bar carries a raised coral + key.
   Shelf is a sticker collection. Sheets slide up for the full story, keeping something, and settings. */
:root{
  --bg:#EEF0F6; --surface:#FFFFFF; --sunk:#E3E6EF; --ink:#161B2E; --muted:#5E6478; --line:#DCE0EA;
  --accent:#FF6A3D; --accent-ink:#2A0E04; --accent-soft:#FFE1D6; --accent-text:#C8431C;
  --good:#11935E; --good-ink:#FFFFFF; --warn:#C2412B;
  --scrim:rgba(14,18,32,.45); --shadow:0 18px 36px -20px rgba(22,27,46,.45); --fab-shadow:0 14px 26px -12px rgba(255,106,61,.85);
  --overlay:rgba(255,255,255,.3);
  /* card tones: vivid in both themes, each with its own readable ink */
  --tone-coral:#FF6A3D; --tone-coral-ink:#2A0E04;
  --tone-blue:#3B6CF6;  --tone-blue-ink:#FFFFFF;
  --tone-green:#0F8A57; --tone-green-ink:#FFFFFF;
  --tone-rose:#D63B6F;  --tone-rose-ink:#FFFFFF;
  --tone-sun:#F4B400;   --tone-sun-ink:#2B1F00;
  --tone-teal:#0E8F9B;  --tone-teal-ink:#FFFFFF;
  --tone-violet:#7356E0;--tone-violet-ink:#FFFFFF;
  /* stickers */
  --soft-coral:#FFE1D6; --soft-coral-ink:#8A2A0C;
  --soft-blue:#DDE6FE;  --soft-blue-ink:#1D3FA6;
  --soft-green:#D3F2E4; --soft-green-ink:#0D6B45;
  --soft-rose:#FADCE6;  --soft-rose-ink:#8E1E46;
  --soft-sun:#FBEAC2;   --soft-sun-ink:#6E5000;
  --soft-teal:#D2F0F2;  --soft-teal-ink:#0B5F67;
  --soft-violet:#E7E0FB;--soft-violet-ink:#4B2FB0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:76px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#181C2E; --sunk:#1F2438; --ink:#EEF0F6; --muted:#9AA1B8; --line:#2A3048;
  --accent:#FF7A50; --accent-ink:#2A0E04; --accent-soft:#3D2219; --accent-text:#FFA585;
  --good:#3CC48A; --good-ink:#06281A; --warn:#F0806A;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 36px -20px rgba(0,0,0,.8); --fab-shadow:0 14px 26px -12px rgba(255,122,80,.6);
  --soft-coral:#3D2219; --soft-coral-ink:#FFB59C;
  --soft-blue:#1B2550;  --soft-blue-ink:#AFC2FF;
  --soft-green:#123A2A; --soft-green-ink:#8FE0B8;
  --soft-rose:#3D1A28;  --soft-rose-ink:#F7A8C3;
  --soft-sun:#3A2E0D;   --soft-sun-ink:#F5D47A;
  --soft-teal:#0F3336;  --soft-teal-ink:#8ADCE3;
  --soft-violet:#2A2150;--soft-violet-ink:#C4B5FD;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#181C2E; --sunk:#1F2438; --ink:#EEF0F6; --muted:#9AA1B8; --line:#2A3048;
  --accent:#FF7A50; --accent-ink:#2A0E04; --accent-soft:#3D2219; --accent-text:#FFA585;
  --good:#3CC48A; --good-ink:#06281A; --warn:#F0806A;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 36px -20px rgba(0,0,0,.8); --fab-shadow:0 14px 26px -12px rgba(255,122,80,.6);
  --soft-coral:#3D2219; --soft-coral-ink:#FFB59C;
  --soft-blue:#1B2550;  --soft-blue-ink:#AFC2FF;
  --soft-green:#123A2A; --soft-green-ink:#8FE0B8;
  --soft-rose:#3D1A28;  --soft-rose-ink:#F7A8C3;
  --soft-sun:#3A2E0D;   --soft-sun-ink:#F5D47A;
  --soft-teal:#0F3336;  --soft-teal-ink:#8ADCE3;
  --soft-violet:#2A2150;--soft-violet-ink:#C4B5FD;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--accent-text)}
.app{max-width:520px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1}
.brand i{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-style:normal;font-size:15px;flex:none;transform:rotate(-6deg)}
.sub{color:var(--muted);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.iconbtn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn svg{width:20px;height:20px}
.segs{display:grid;gap:6px;padding-top:12px}
.segs span{height:5px;border-radius:9px;background:var(--line);transition:background .3s}
.segs span.on{background:var(--ink)}

.banner{background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:11px 14px;font-size:14.5px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner span{flex:1 1 220px;min-width:0}

/* today: full-height deck */
#view-today{height:calc(100vh - var(--bar) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--bar) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));display:flex;flex-direction:column;min-height:520px}
.deck{position:relative;flex:1;min-height:330px;margin-top:6px;margin-bottom:10px}
.t-coral{--tb:var(--tone-coral);--ti:var(--tone-coral-ink)} .t-blue{--tb:var(--tone-blue);--ti:var(--tone-blue-ink)}
.t-green{--tb:var(--tone-green);--ti:var(--tone-green-ink)} .t-rose{--tb:var(--tone-rose);--ti:var(--tone-rose-ink)}
.t-sun{--tb:var(--tone-sun);--ti:var(--tone-sun-ink)} .t-teal{--tb:var(--tone-teal);--ti:var(--tone-teal-ink)}
.t-violet{--tb:var(--tone-violet);--ti:var(--tone-violet-ink)}
.peek{position:absolute;left:12px;right:12px;top:12px;bottom:-10px;border-radius:30px;background:var(--tb);opacity:.85;transform:rotate(2.2deg)}
.peek.p2{left:24px;right:24px;top:22px;bottom:-18px;opacity:.5;transform:rotate(-2deg)}
.story{position:absolute;inset:0;border-radius:30px;background:var(--tb);color:var(--ti);padding:22px 22px 16px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .28s;will-change:transform}
.story.dragging{transition:none;cursor:grabbing}
.story.fly-right{transform:translateX(135%) rotate(16deg)!important;opacity:0}
.story.fly-left{transform:translateX(-135%) rotate(-16deg)!important;opacity:0}
.chip{align-self:flex-start;background:var(--overlay);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.chip .gl{text-transform:none;letter-spacing:0}
.heard{font-size:14px;margin-top:12px;opacity:.85}
.story > *,.sheethead > *{flex-shrink:0}
.grow{flex:1 1 auto;min-height:8px}
.big{font-family:var(--f-display);font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;overflow-wrap:anywhere;hyphens:auto}
.big.xl{font-size:56px}.big.l{font-size:45px}.big.m{font-size:37px}.big.s{font-size:30px}
.phon{font-size:16px;opacity:.85;margin-top:8px}
.oneliner{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.25;margin:14px 0 0;letter-spacing:-.005em}
.ex{background:var(--overlay);border-radius:16px;padding:11px 14px;margin-top:14px;font-size:15.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ex b{font-weight:700}
.swipehint{text-align:center;font-size:13px;font-weight:700;margin-top:14px;opacity:.75}
.stamp{position:absolute;top:22px;padding:5px 12px;border:3px solid currentColor;border-radius:10px;background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.04em;opacity:0;pointer-events:none}
.stamp.got{left:20px;color:var(--good);transform:rotate(-10deg)}
.stamp.later{right:20px;color:var(--muted);transform:rotate(10deg)}

.acts3{display:flex;justify-content:center;align-items:flex-end;gap:30px;padding-block:8px 10px}
.ac{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);padding:0}
.ac span{width:58px;height:58px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.ac svg{width:24px;height:24px}
.ac:active span{transform:scale(.92)}
.ac.go span{width:72px;height:72px;background:var(--good);border:0;color:var(--good-ink);box-shadow:0 12px 24px -12px var(--good)}
.ac.go svg{width:32px;height:32px}

.endcard{position:absolute;inset:0;border-radius:30px;background:var(--surface);border:1px solid var(--line);padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;overflow-y:auto}
.endcard h2{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.1}
.endcard p{color:var(--muted);margin:0;max-width:32ch}
.bigcheck,.bigtile{width:78px;height:78px;border-radius:24px;display:grid;place-items:center;transform:rotate(-6deg);margin-bottom:4px}
.bigcheck{background:var(--good);color:var(--good-ink)} .bigcheck svg{width:40px;height:40px}
.bigtile{background:var(--accent);color:var(--accent-ink);font-size:36px}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.glow{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:breathe 1.5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;font-size:15.5px;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.35;cursor:default}
.btn.lamp{background:var(--accent);color:var(--accent-ink)}
.btn.good{background:var(--good);color:var(--good-ink)}
.btn.line{background:var(--sunk);color:var(--ink)}
.btn svg{width:18px;height:18px}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--accent-text);font-weight:700;font-size:14.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* stickers */
.stickers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stickers.left{justify-content:flex-start}
.st{border:0;padding:8px 13px;border-radius:12px;font-weight:700;font-size:14.5px;line-height:1.25;text-align:left;max-width:100%;overflow-wrap:anywhere}
.s-coral{background:var(--soft-coral);color:var(--soft-coral-ink)} .s-blue{background:var(--soft-blue);color:var(--soft-blue-ink)}
.s-green{background:var(--soft-green);color:var(--soft-green-ink)} .s-rose{background:var(--soft-rose);color:var(--soft-rose-ink)}
.s-sun{background:var(--soft-sun);color:var(--soft-sun-ink)} .s-teal{background:var(--soft-teal);color:var(--soft-teal-ink)}
.s-violet{background:var(--soft-violet);color:var(--soft-violet-ink)}
.dot-coral{background:var(--tone-coral)}.dot-blue{background:var(--tone-blue)}.dot-green{background:var(--tone-green)}.dot-rose{background:var(--tone-rose)}.dot-sun{background:var(--tone-sun)}.dot-teal{background:var(--tone-teal)}.dot-violet{background:var(--tone-violet)}

/* shelf */
#view-shelf{padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom,0px) + 32px)}
.hero{display:flex;align-items:flex-end;gap:14px;margin-top:4px}
.hero .n{font-family:var(--f-display);font-weight:800;font-size:72px;line-height:.85;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hero .lbl{font-weight:700;font-size:17px;line-height:1.25;padding-bottom:2px}
.hero .lbl small{display:block;color:var(--muted);font-weight:500;font-size:14.5px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 10px 12px;margin-top:18px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wd i{width:30px;height:30px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-size:13px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.wd i.on{background:var(--accent)}
.wd.today{color:var(--ink)}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 13px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.shelfbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipf{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
.chipf i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chipf .c{font-variant-numeric:tabular-nums;color:var(--muted)}
.chipf[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipf[aria-pressed="true"] .c{color:inherit;opacity:.7}
.daygroup{margin-top:22px}
.daygroup h4{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.emptyshelf{margin-top:22px;background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:20px;color:var(--muted)}
.emptyshelf b{color:var(--ink)}
.sh3{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.015em;margin-top:30px}
.sh3 + p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.nextchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pillbtn{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-size:14.5px;font-weight:600}
details.jar{margin-top:28px;border-top:1px solid var(--line);padding-top:6px}
details.jar summary{cursor:pointer;color:var(--muted);padding:10px 2px;font-size:15px;font-weight:600;list-style:none}
details.jar summary::-webkit-details-marker{display:none}
details.jar summary::before{content:"+";display:inline-block;width:18px;color:var(--accent-text);font-weight:800}
details.jar[open] summary::before{content:"–"}
.jrow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.jrow .jt{flex:1;min-width:0;overflow-wrap:anywhere}
.jrow .js{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);flex:none}
.jsub{display:block;margin-top:16px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.muted{color:var(--muted)}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:520px;margin:0 auto;height:var(--bar);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);padding:6px 0}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{color:var(--accent-text)}
.fab{width:66px;height:66px;border-radius:22px;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;margin-top:-34px;box-shadow:var(--fab-shadow);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:24px 24px 0 0;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .24s cubic-bezier(.2,.8,.2,1)}
.grab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-8px;background:var(--bg);padding-block:10px 8px;z-index:3}
.grab .lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.ghost{border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;padding:8px 4px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-radius:24px;max-height:86%}}
@keyframes rise{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheethead{border-radius:24px;background:var(--tb);color:var(--ti);padding:20px 20px 22px;display:flex;flex-direction:column}
.sheethead .big.xl{font-size:48px}.sheethead .big.l{font-size:40px}
.sheethead .big{margin-top:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin-top:12px}
.sec h3{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;margin-bottom:10px}
.sec p{margin:0 0 10px}.sec p:last-child{margin-bottom:0}
.sec ul{margin:0 0 10px;padding-left:20px}.sec li{margin-bottom:4px}
.extras{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:8px 14px;margin:0 0 14px;font-size:15px}
.extras dt{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.extras dd{margin:0;overflow-wrap:anywhere}
.sources{margin:10px 0 0;padding:0;list-style:none;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sources a{overflow-wrap:anywhere}
.sheetacts{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));margin-top:12px;display:flex;gap:10px;align-items:center;z-index:3}
.sheetacts .btn{flex:1}
.sheetacts .note{flex:1;color:var(--muted);font-size:14px}
.minor{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;margin-top:14px}
.plain{padding:6px 2px}
.sh2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:15.5px;min-width:0;overflow-wrap:anywhere}
.msg p{margin:0 0 8px}.msg p:last-child{margin-bottom:0}
.msg ul{margin:0 0 8px;padding-left:20px}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);padding:9px 13px;border-radius:16px 16px 4px 16px}
.msg.ai{align-self:flex-start;background:var(--sunk);padding:10px 14px;border-radius:16px 16px 16px 4px}
.msg .by{display:block;margin-top:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chatbox{display:flex;gap:8px;align-items:flex-end;margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.chatbox textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;font-size:16px;line-height:1.4;max-height:140px;padding:7px 0}
.chatbox textarea:focus{outline:none}
.chatbox .btn{padding:9px 16px}
.chatfoot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:13.5px;color:var(--muted)}
.chatfoot .spacer{flex:1}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted)}
.thinking .glow{width:9px;height:9px}

/* capture sheet */
.capform{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.capform textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:18px;resize:none;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.3;padding:14px 16px;min-height:120px}
.capform textarea::placeholder{color:var(--muted);opacity:.8;font-weight:500}
.caprow{display:flex;gap:12px;align-items:center}
.caprow .btn{flex:1;padding-block:15px;font-size:17px}
.micbig{width:56px;height:56px;border-radius:18px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.micbig svg{width:24px;height:24px}
.micbig.live{background:var(--accent);color:var(--accent-ink);border-color:transparent;animation:breathe2 1.4s ease-in-out infinite}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.mic.live{background:var(--accent)}

/* settings */
.form{display:flex;flex-direction:column;gap:18px;padding-top:4px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.help{font-size:13.5px;color:var(--muted);margin:0}
.inrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.input{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15.5px}
.input.num{flex:0 0 110px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.over{background:var(--warn)}
.spend{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums;font-size:15px;flex-wrap:wrap}
.steps{margin:0;padding-left:20px;font-size:15px;display:flex;flex-direction:column;gap:6px}
.status{font-size:14px}
.status.good{color:var(--good)} .status.bad{color:var(--warn)}
hr.sep{border:0;border-top:1px solid var(--line);margin:2px 0}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:14.5px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}

@media (prefers-reduced-motion:reduce){.glow,.micbig.live{animation:none}.panel{animation:none}.story{transition:none}}
@media (max-height:700px){.story{padding:18px 18px 14px}.big.xl{font-size:44px}.big.l{font-size:38px}.big.m{font-size:32px}.oneliner{font-size:19px;margin-top:10px}.ex{-webkit-line-clamp:2;margin-top:10px;padding:9px 12px}.swipehint{display:none}.ac span{width:50px;height:50px}.ac.go span{width:62px;height:62px}.acts3{padding-block:4px 6px}}
@media (max-height:600px){.ex{display:none}}
@media (max-width:360px){.big.xl{font-size:46px}.big.l{font-size:38px}.big.m{font-size:32px}}
</style>
</head>

<script>
(() => {
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY = 86400000;
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const monthKey = (t) => dayKey(t).slice(0, 7);
const today = () => dayKey(Date.now());
const fmtDay = (t) => new Date(t).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
const dayLabel = (k) => {
  if (k === today()) return 'Today';
  if (k === dayKey(Date.now() - DAY)) return 'Yesterday';
  const [y, m, d] = k.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'short'});
};
const usd = (n) => '$' + (n || 0).toFixed(2);

/* ---------------- Claude API ---------------- */
const API = 'https://api.anthropic.com/v1/messages';
const MODELS = {
  haiku: {id:'claude-haiku-5-5', name:'Haiku', inP:0.10, outP:0.50, bigInP:0.50, bigOutP:2.50, big:100000},
  sonnet: {id:'claude-sonnet-5-5', name:'Sonnet', inP:2.00, outP:10.00}
};
const SEARCH_PRICE = 0.01; // $10 per 1,000 searches
const SEARCH_TYPES = ['web_search_20250305', 'web_search_20260209'];

/* ---------------- Gemini API (free tier) ---------------- */
const GEMINI = 'https://generativelanguage.googleapis.com/v1beta';
const GEMINI_FALLBACK = {flash:'gemini-flash-latest', lite:'gemini-flash-lite-latest'};
const gBenched = {}; // model -> time it may be tried again (its daily quota ran out)

/* ---------------- storage (IndexedDB) ---------------- */
let idb = null;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('capture', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('items', {keyPath:'id'}); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = idb.transaction(store, mode); const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = () => rej(t.error);
  });
}
const putItem = (it) => tx('items', 'readwrite', (s) => s.put(JSON.parse(JSON.stringify(it)))).catch(storageErr);
const delItem = (id) => tx('items', 'readwrite', (s) => s.delete(id)).catch(storageErr);
const getKV = (k) => tx('kv', 'readonly', (s) => s.get(k));
const setKV = (k, v) => tx('kv', 'readwrite', (s) => s.put(v, k)).catch(storageErr);
function storageErr(e) { console.warn(e); toast("Couldn't save on this phone. Is storage full?"); }

/* ---------------- state ---------------- */
const items = new Map();
let meta = {dropDate:'', dropIds:[]};
let settings = {provider:'gemini', geminiKey:'', gModels:null, geminiSearch:true, apiKey:'', cap:3, chatModel:'haiku', searchCards:true};
let usage = {day:'', counts:{}};
const isGemini = () => settings.provider !== 'claude';
const hasKey = () => isGemini() ? !!settings.geminiKey : !!settings.apiKey;
const aiName = () => isGemini() ? 'Gemini' : 'Claude';
let spend = {month:monthKey(Date.now()), usd:0, calls:0, searches:0};
let fresh = [];
const open = new Set();
let view = 'today', range = 'week', cat = 'All', sheet = null; // sheet: {type:'card'|'settings', id}
let blocked = null; // 'no_key'|'bad_key'|'no_credit'|'cap'
let pausedUntil = 0, speakingId = null, loaded = false;
const chatBusy = new Set();
const all = () => [...items.values()];
const canSpeak = 'speechSynthesis' in window && typeof SpeechSynthesisUtterance !== 'undefined';

/* ---------------- small UI helpers ---------------- */
function setBanner(text, btnLabel, btnAction) {
  $('#bannerText').textContent = text; $('#banner').hidden = false;
  const b = $('#bannerBtn'); b.hidden = !btnLabel; b.textContent = btnLabel || ''; b.dataset.a = btnAction || '';
}
function clearBanner() { $('#banner').hidden = true; }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (el.hidden = true), 2800); }

/* ---------------- spend ---------------- */
function rollMonth() { const m = monthKey(Date.now()); if (spend.month !== m) spend = {month:m, usd:0, calls:0, searches:0}; }
function overCap() { rollMonth(); return settings.cap > 0 && spend.usd >= settings.cap; }
function costOf(model, usage) {
  const m = MODELS[model];
  const inTok = (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0) * 1.25 + (usage.cache_read_input_tokens || 0) * 0.1;
  const outTok = usage.output_tokens || 0;
  const bigPrompt = m.big && (usage.input_tokens || 0) > m.big;
  const searches = usage.server_tool_use?.web_search_requests || 0;
  return {usd: inTok / 1e6 * (bigPrompt ? m.bigInP : m.inP) + outTok / 1e6 * (bigPrompt ? m.bigOutP : m.outP) + searches * SEARCH_PRICE, searches};
}
function recordSpend(c) { rollMonth(); spend.usd += c.usd; spend.calls += 1; spend.searches += c.searches; setKV('spend', spend); }

let searchTypeIdx = 0;
async function callClaude({model, system, messages, maxTokens, search}) {
  if (!settings.apiKey) throw {code:'no_key'};
  if (overCap()) throw {code:'cap'};
  const m = MODELS[model];
  let conv = messages.slice();
  const content = [];
  for (let round = 0; round < 3; round++) {
    const body = {model:m.id, max_tokens:maxTokens, system, messages:conv};
    if (search) body.tools = [{type:SEARCH_TYPES[searchTypeIdx], name:'web_search', max_uses:search}];
    let res, data;
    try {
      res = await fetch(API, {method:'POST', headers:{
        'content-type':'application/json', 'x-api-key':settings.apiKey,
        'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true'
      }, body:JSON.stringify(body)});
      data = await res.json().catch(() => ({}));
    } catch (e) { throw {code:'offline'}; }
    if (!res.ok) {
      const msg = data?.error?.message || '';
      if (res.status === 401 || res.status === 403) throw {code:'bad_key', msg};
      if (/credit balance/i.test(msg)) throw {code:'no_credit', msg};
      if (res.status === 400 && search && /web_search|tool/i.test(msg) && searchTypeIdx < SEARCH_TYPES.length - 1) { searchTypeIdx++; round--; continue; }
      if (res.status === 429) throw {code:'rate', msg};
      if (res.status >= 500) throw {code:'busy', msg};
      throw {code:'api', msg: msg || ('HTTP ' + res.status)};
    }
    if (data.usage) recordSpend(costOf(model, data.usage));
    content.push(...(data.content || []));
    if (data.stop_reason === 'pause_turn') { conv = [...messages, {role:'assistant', content:content.slice()}]; continue; }
    break;
  }
  let text = '';
  const sources = [];
  for (const b of content) {
    if (b.type !== 'text') continue;
    text += b.text;
    for (const c of b.citations || []) if (c.url && !sources.some((s) => s.url === c.url)) sources.push({url:c.url, title:c.title || c.url});
  }
  return {text:text.trim(), sources:sources.slice(0, 6)};
}

/* Gemini: free daily quotas reset at midnight Pacific time */
function quotaResetAt() {
  try {
    const now = new Date();
    const la = new Date(now.toLocaleString('en-US', {timeZone:'America/Los_Angeles'}));
    const next = new Date(la); next.setHours(24, 0, 0, 0);
    return now.getTime() + (next - la);
  } catch { return Date.now() + 60 * 60000; }
}
function rollUsage() { if (usage.day !== today()) usage = {day:today(), counts:{}}; }
function countUse(label) { rollUsage(); usage.counts[label] = (usage.counts[label] || 0) + 1; setKV('usage', usage); }

async function gFetch(path, opts = {}) {
  let res, data;
  try {
    res = await fetch(GEMINI + path, {...opts, headers:{'content-type':'application/json', 'x-goog-api-key':settings.geminiKey}});
    data = await res.json().catch(() => ({}));
  } catch { throw {code:'offline'}; }
  if (!res.ok) {
    const msg = data?.error?.message || ('HTTP ' + res.status);
    const raw = JSON.stringify(data?.error || {});
    const http = res.status;
    if ((http === 400 && /api key/i.test(msg)) || http === 401 || http === 403) throw {code:'bad_key', msg, http};
    if (http === 429) throw {code:/PerDay|per day|daily/i.test(raw) ? 'quota_day' : 'rate', msg, http};
    if (http === 404) throw {code:'no_model', msg, http};
    if (http >= 500) throw {code:'busy', msg, http};
    throw {code:'api', msg, http};
  }
  return data;
}
async function discoverGemini() {
  const data = await gFetch('/models?pageSize=1000', {method:'GET'});
  const re = /^gemini-(\d+(?:\.\d+)?)-flash(-lite)?(-preview(?:-[\w-]+)?)?$/;
  const found = [];
  for (const m of data.models || []) {
    const n = String(m.name || '').replace(/^models\//, '');
    if (!(m.supportedGenerationMethods || []).includes('generateContent')) continue;
    const r = n.match(re);
    if (r) found.push({n, v:parseFloat(r[1]), lite:!!r[2], pre:!!r[3]});
  }
  const best = (lite) => found.filter((x) => x.lite === lite).sort((a, b) => (a.pre - b.pre) || (b.v - a.v))[0]?.n;
  return {flash:best(false) || GEMINI_FALLBACK.flash, lite:best(true) || GEMINI_FALLBACK.lite};
}
async function callGemini({system, messages, json, search}) {
  if (!settings.geminiKey) throw {code:'no_key'};
  const gm = settings.gModels || GEMINI_FALLBACK;
  let lastErr = null;
  for (const [label, model] of [['Flash', gm.flash], ['Flash-Lite', gm.lite]]) {
    if ((gBenched[model] || 0) > Date.now()) { lastErr = {code:'quota_day'}; continue; }
    let useSearch = !!search && settings.geminiSearch;
    for (let attempt = 0; attempt < 2; attempt++) {
      const body = {contents:messages.map((m) => ({role:m.role === 'assistant' ? 'model' : 'user', parts:[{text:m.content}]}))};
      if (system) body.systemInstruction = {parts:[{text:system}]};
      if (json) body.generationConfig = {responseMimeType:'application/json'};
      if (useSearch) body.tools = [{google_search:{}}];
      try {
        const data = await gFetch(`/models/${encodeURIComponent(model)}:generateContent`, {method:'POST', body:JSON.stringify(body)});
        countUse(label);
        const cand = data.candidates?.[0];
        const text = (cand?.content?.parts || []).filter((p) => p.text && !p.thought).map((p) => p.text).join('').trim();
        if (!text) {
          if (data.promptFeedback?.blockReason || ['SAFETY','PROHIBITED_CONTENT','BLOCKLIST','RECITATION'].includes(cand?.finishReason)) throw {code:'blocked'};
          throw {code:'api', msg:'An empty answer came back.'};
        }
        const sources = [];
        for (const ch of cand.groundingMetadata?.groundingChunks || []) {
          const w = ch.web;
          if (w?.uri && !sources.some((s) => s.url === w.uri)) sources.push({url:w.uri, title:w.title || w.uri});
        }
        return {text, sources:sources.slice(0, 6), by:'Gemini ' + label};
      } catch (e) {
        lastErr = e;
        // The free tier often refuses Google Search: switch it off and answer without it.
        if (useSearch && e.code !== 'offline' && e.code !== 'blocked' && !/api key/i.test(e.msg || '') &&
            (e.http === 400 || e.http === 403 || /search|ground/i.test(e.msg || ''))) {
          useSearch = false; settings.geminiSearch = false; setKV('settings', settings);
          toast("Google Search isn't available on the free tier, so Gemini will answer from what it knows.");
          continue;
        }
        if (['rate','quota_day','no_model','busy'].includes(e.code)) {
          if (e.code === 'quota_day') gBenched[model] = quotaResetAt();
          break; // try the next model
        }
        throw e;
      }
    }
  }
  throw lastErr || {code:'api'};
}
async function callAI({system, messages, json, search, model, maxTokens}) {
  if (isGemini()) return callGemini({system, messages, json, search});
  const m = model || 'haiku';
  const r = await callClaude({model:m, system, messages, maxTokens, search:search || 0});
  return {...r, by:MODELS[m].name};
}

function explainError(e) {
  switch (e?.code) {
    case 'no_key': return `Add your ${aiName()} API key in Settings to get things explained.`;
    case 'bad_key': return `Your ${aiName()} API key didn't work. Check it in Settings.`;
    case 'no_credit': return 'Your Claude credits have run out. Top up in the Claude Console and things will continue.';
    case 'cap': return `You've reached this month's limit of ${usd(settings.cap)}. Raise it in Settings, or continue in the Claude app.`;
    case 'offline': return "You're offline. Things you keep are saved and will be explained when you're back online.";
    case 'quota_day': return `You've used today's free Gemini requests. Your things are saved and will be explained after the quota resets at ${new Date(quotaResetAt()).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}.`;
    case 'rate': return isGemini() ? 'Too many requests in one minute for the free tier. Capture will carry on by itself shortly.' : 'Claude is busy right now. Your things are saved; they will be explained a bit later.';
    case 'busy': return `${aiName()} is busy right now. Your things are saved; they will be explained a bit later.`;
    case 'blocked': return `${aiName()} wouldn't answer this one. Try wording it differently.`;
    case 'no_model': return "Gemini couldn't find its model. Open Settings and tap Save & test again.";
    default: return `Something went wrong talking to ${aiName()}` + (e?.msg ? ': ' + e.msg : '.');
  }
}
let resumeT;
function handleBlocking(e) {
  const c = e?.code;
  if (['no_key','bad_key','no_credit','cap'].includes(c)) { blocked = c; setBanner(explainError(e), c === 'no_credit' ? 'Open Console' : 'Settings', c === 'no_credit' ? 'console' : 'settings'); return true; }
  if (['offline','rate','busy','quota_day'].includes(c)) {
    pausedUntil = c === 'offline' ? 0 : c === 'quota_day' ? quotaResetAt() : Date.now() + (c === 'rate' && isGemini() ? 65000 : 5 * 60000);
    if (c !== 'offline') setBanner(explainError(e));
    clearTimeout(resumeT);
    if (pausedUntil) resumeT = setTimeout(() => { clearBanner(); pump(); }, Math.min(pausedUntil - Date.now() + 1000, 2147000000));
    return true;
  }
  return false;
}

/* ---------------- card generation ---------------- */
function cardPrompt(it, cats) {
  return `What I jotted: """${it.q}"""
Where it came up (may be empty): """${it.ctx || ''}"""
Categories already on my shelf: ${cats.length ? cats.join(', ') : '(none yet)'}`;
}
const cardSystem = (canSearch) => `You prepare one small learning card for a curious person in India. They jot things down when they hear them (a word, a topic, something in the news, a product, a life situation) and want them explained so they can learn without searching. Write in plain, friendly English with simple words; they are also improving their English, so briefly explain any hard word you must use. Be accurate and specific. No filler, no greetings.

Decide what the jotted thing is. "kind" is one of: word, phrase, concept, tech, news, product, place, person, how-to, life, other.
Pick a shelf "category" of 1-2 words in Title Case (like Words, Tech, Money, Health, Work, Science, Shopping, World, Life). Reuse an existing category when one fits.
If the text is unclear or misspelled, go with the most likely meaning and use the corrected name as the title.
${canSearch ? "Use web search only when the thing is about recent news, current prices or products, or something you don't recognise. For ordinary words and concepts, don't search." : 'If it involves recent news or prices, give what you know and say roughly how current that is.'} Give prices in Indian rupees.
Match depth to the thing: a simple everyday word gets a short "deep"; a big topic gets a fuller one.

Reply with only one JSON object, no other text:
{"kind":"word","category":"Words","title":"clean name, max 6 words","oneLiner":"the essence in one sentence, max 25 words","gist":"60-110 words in 1-2 short paragraphs separated by a blank line, with one everyday example or analogy","deep":"120-350 words: how it works, background, nuance, common mistakes or how to use it. Paragraphs separated by a blank line; lines starting with '- ' for lists","extras":[{"label":"Pronunciation","value":"..."}],"related":["2-3 short things worth learning next"]}
For "extras" give 2-4 items that suit the kind. word or phrase: Pronunciation, Example sentence, Simpler word, Opposite. product: What to look for, Price range, Good picks. news: What happened, Why it matters, What to watch. concept or tech: Analogy, Where you'll hear it. how-to: First step, Common mistake. Otherwise choose what helps most.`;

const str = (v, max) => String(v ?? '').trim().slice(0, max);
function parseCard(text, q) {
  let r = null;
  const a = text.indexOf('{'), b = text.lastIndexOf('}');
  if (a >= 0 && b > a) { try { r = JSON.parse(text.slice(a, b + 1)); } catch {} }
  if (!r || typeof r !== 'object') throw {code:'bad_json'};
  const extras = Array.isArray(r.extras) ? r.extras.filter((e) => e && e.label && e.value).slice(0, 4).map((e) => ({label:str(e.label, 40), value:str(e.value, 400)})) : [];
  const related = Array.isArray(r.related) ? r.related.map((x) => str(x, 80)).filter(Boolean).slice(0, 3) : [];
  return {kind:str(r.kind, 20).toLowerCase() || 'other', category:str(r.category, 24) || 'Other', title:str(r.title, 80) || q,
    oneLiner:str(r.oneLiner, 300), gist:str(r.gist, 2000), deep:str(r.deep, 5000), extras, related};
}

let pumping = false;
const inflight = new Set();
async function pump() {
  if (pumping || blocked || Date.now() < pausedUntil || !navigator.onLine) return;
  if (!hasKey()) { blocked = 'no_key'; render(); return; }
  pumping = true;
  try {
    for (;;) {
      const next = all().filter((i) => i.status === 'brewing' && !inflight.has(i.id)).sort((a, b) => a.createdAt - b.createdAt)[0];
      if (!next) break;
      inflight.add(next.id); render();
      const go = await generate(next);
      inflight.delete(next.id);
      render(); maybeFillDrop();
      if (!go) break;
    }
  } finally { pumping = false; render(); }
}
async function generate(it) {
  const cats = [...new Set(all().map((i) => i.category).filter(Boolean))].slice(0, 30);
  try {
    let card, sources = [], by = '';
    const canSearch = !isGemini() && settings.searchCards;
    const base = {system:cardSystem(canSearch), json:true, maxTokens:1800};
    try {
      const r = await callAI({...base, messages:[{role:'user', content:cardPrompt(it, cats)}], search:canSearch ? 2 : 0});
      card = parseCard(r.text, it.q); sources = r.sources; by = r.by;
    } catch (e) {
      if (e?.code !== 'bad_json') throw e;
      const r = await callAI({...base, messages:[{role:'user', content:cardPrompt(it, cats) + '\n\nReply with the JSON object only.'}], search:0});
      card = parseCard(r.text, it.q); by = r.by;
    }
    Object.assign(it, {status:'ready', readyAt:Date.now(), title:card.title, category:card.category, type:card.kind, card, sources, by, err:null});
    await putItem(it);
    if (blocked === null) clearBanner();
    return true;
  } catch (e) {
    if (handleBlocking(e)) return false;
    Object.assign(it, {status:'failed', err:e?.code === 'bad_json' ? "Claude's answer came back in the wrong shape." : explainError(e)});
    await putItem(it);
    return true;
  }
}

/* ---------------- daily three ---------------- */
function dropIds() { return meta.dropDate === today() ? (meta.dropIds || []).filter((id) => items.has(id)) : []; }
function handledToday(i) { return i.state === 'learned' || i.state === 'letgo' || (i.state === 'later' && i.laterOn === today()); }
function candidates() {
  const d = new Set(dropIds());
  return all().filter((i) => i.status === 'ready' && !d.has(i.id) && (i.state === 'waiting' || (i.state === 'later' && i.laterOn !== today())));
}
function pick(n, current) {
  const pool = candidates().sort((a, b) => (a.state === 'later') - (b.state === 'later') || a.createdAt - b.createdAt);
  const kinds = new Set(current.map((id) => items.get(id)?.type));
  const out = [];
  for (const i of pool) { if (out.length >= n) break; if (!kinds.has(i.type)) { out.push(i.id); kinds.add(i.type); } }
  for (const i of pool) { if (out.length >= n) break; if (!out.includes(i.id)) out.push(i.id); }
  return out;
}
function maybeFillDrop(extra) {
  if (!loaded) return;
  const cur = dropIds();
  const want = extra ? extra : 3 - cur.length;
  if (want <= 0) return;
  const add = pick(want, cur);
  if (!add.length) return;
  meta = {dropDate:today(), dropIds:[...cur, ...add]};
  setKV('meta', meta);
  render();
}

/* ---------------- actions ---------------- */
async function capture(q, ctx) {
  q = (q || '').trim();
  if (!q) return;
  const id = 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const it = {id, q:q.slice(0, 300), ctx:(ctx || '').trim().slice(0, 300), createdAt:Date.now(), status:'brewing', state:'waiting', chat:[]};
  items.set(id, it);
  fresh = [id, ...fresh].slice(0, 4);
  await putItem(it);
  render();
  pump();
}
function act(id, a) {
  const it = items.get(id);
  if (!it) return;
  let msg = '';
  if (a === 'got') { Object.assign(it, {state:'learned', learnedAt:Date.now()}); msg = 'On your shelf.'; }
  else if (a === 'later') { Object.assign(it, {state:'later', laterOn:today()}); msg = 'Okay, another day.'; }
  else if (a === 'letgo') { Object.assign(it, {state:'letgo', letgoAt:Date.now()}); msg = "Let go. It's in the jar if you change your mind."; }
  else if (a === 'back') { Object.assign(it, {state:'waiting'}); msg = 'Back in the jar.'; }
  else if (a === 'retry') { Object.assign(it, {status:'brewing', err:null}); blocked = null; pausedUntil = 0; msg = 'Trying again.'; }
  else if (a === 'forget') { items.delete(id); delItem(id); fresh = fresh.filter((f) => f !== id); closeSheet(); toast('Deleted.'); render(); return; }
  else return;
  if (['got','later','letgo'].includes(a)) { fresh = fresh.filter((f) => f !== id); if (sheet?.type === 'card' && sheet.id === id) closeSheet(); }
  if (speakingId === id) stopSpeaking();
  putItem(it);
  toast(msg);
  render();
  if (a === 'retry') pump();
}

/* speech out */
function stopSpeaking() { try { speechSynthesis.cancel(); } catch {} speakingId = null; }
function speak(id) {
  const it = items.get(id);
  if (!it?.card) return;
  if (speakingId === id) { stopSpeaking(); render(); return; }
  try {
    speechSynthesis.cancel();
    const c = it.card;
    const parts = [c.title + '.', c.oneLiner, c.gist];
    if (open.has(id + ':d')) parts.push(c.deep);
    const u = new SpeechSynthesisUtterance(parts.filter(Boolean).join('\n\n').replace(/^\s*-\s+/gm, '').replace(/\*\*/g, ''));
    u.rate = 0.97; u.lang = 'en-IN';
    u.onend = u.onerror = () => { if (speakingId === id) { speakingId = null; render(); } };
    speakingId = id;
    speechSynthesis.speak(u);
  } catch { speakingId = null; toast("Listening isn't available here."); }
  render();
}

/* chat */
function chatSystem(it) {
  const c = it.card || {};
  return `You're a friendly explainer inside a personal learning app. The person is learning about "${c.title || it.q}". Their card says: ${c.oneLiner || ''}\n\n${c.gist || ''}\n\nAnswer their questions in plain, simple English (they are improving their English too). Keep answers short, under 150 words, unless they ask for more. Use short paragraphs, and "- " lines for lists. ${(!isGemini() || settings.geminiSearch) ? 'Use web search when the question needs current or recent information (news, prices, latest versions); otherwise answer from what you know.' : 'If the question needs very recent information, give what you know and say how current it is.'} Today is ${new Date().toDateString()}.`;
}
async function sendChat(id, text, model) {
  const it = items.get(id);
  if (!it || !text.trim() || chatBusy.has(id)) return;
  it.chat = it.chat || [];
  it.chat.push({role:'user', text:text.trim(), at:Date.now()});
  chatBusy.add(id); putItem(it); render();
  const msgs = it.chat.slice(-12).map((m) => ({role:m.role, content:m.text}));
  while (msgs.length && msgs[0].role !== 'user') msgs.shift();
  try {
    const r = await callAI({model, system:chatSystem(it), messages:msgs, maxTokens:model === 'sonnet' ? 1200 : 900, search:3});
    it.chat.push({role:'assistant', text:r.text || '(No answer came back.)', sources:r.sources, model, by:r.by, at:Date.now()});
  } catch (e) {
    it.chat.push({role:'assistant', text:explainError(e), error:true, at:Date.now()});
    if (['no_key','bad_key','no_credit','cap','quota_day'].includes(e?.code)) handleBlocking(e);
  }
  chatBusy.delete(id);
  putItem(it); render();
  const box = document.getElementById('chatEnd'); if (box) box.scrollIntoView({block:'end', behavior:'smooth'});
}
async function continueInClaude(id) {
  const it = items.get(id); if (!it) return;
  const c = it.card || {};
  let t = `I've been learning about "${c.title || it.q}".\n\nWhat I know so far: ${c.oneLiner || ''}\n\n${c.gist || ''}`;
  const chat = (it.chat || []).filter((m) => !m.error);
  if (chat.length) t += '\n\nOur conversation so far:\n' + chat.map((m) => (m.role === 'user' ? 'Me: ' : 'You: ') + m.text).join('\n\n');
  t += '\n\nLet’s continue from here.';
  let copied = false;
  try { await navigator.clipboard.writeText(t); copied = true; } catch {}
  window.open('https://claude.ai/new?q=' + encodeURIComponent(t.slice(0, 1800)), '_blank', 'noopener');

function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function prose(s) {
  let html = '';
  for (const b of String(s || '').split(/\n{2,}/)) {
    let list = [], para = [];
    const fp = () => { if (para.length) { html += '<p>' + para.map(inline).join(' ') + '</p>'; para = []; } };
    const fl = () => { if (list.length) { html += '<ul>' + list.map((l) => '<li>' + inline(l) + '</li>').join('') + '</ul>'; list = []; } };
    for (const l of b.split('\n')) {
      const m = l.match(/^\s*[-•]\s+(.*)/);
      if (m) { fp(); list.push(m[1]); } else if (l.trim()) { fl(); para.push(l.trim()); }
    }
    fp(); fl();
  }
  return html;
}
